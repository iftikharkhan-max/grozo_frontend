name: grozo
description: "A new Flutter project."
publish_to: 'none'
version: 2.1.0+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  web_socket_channel: ^2.4.1
  url_launcher: ^6.2.0
  geolocator: ^11.0.0
  image_picker: ^1.0.7
  http_parser: ^4.0.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  flutter_localizations:
      sdk: flutter
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png

flutter_launcher_icons:
    android: "launcher_icon"
    ios: true
    image_path: "assets/images/logo.png"